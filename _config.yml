title: "JIWOONG.dev"
description: "DevOps, Infrastructure, Backend 그리고 개발하면서 배운 것들을 기록합니다."
url: "https://www.sea4.net"
baseurl: ""
lang: ko-KR
timezone: Asia/Seoul

markdown: kramdown
highlighter: rouge
permalink: /posts/:title/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Keep publish dates explicit in KST; this comment also retriggers Pages after the latest post time.
